<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessLink</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.screen {
    width: 100%;
    max-width: 900px;
    padding: 20px;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

input {
    width: 100%;
    max-width: 400px;
    padding: 15px;
    margin: 8px;
    border: 2px solid #444;
    border-radius: 10px;
    background: #1d1d1d;
    color: white;
    font-size: 17px;
    text-align: center;
}

button {
    padding: 14px 25px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    background: #eee;
    color: #111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.03);
}

.primary {
    background: #4caf50;
    color: white;
}

.secondary {
    background: #333;
    color: white;
}

.hidden {
    display: none !important;
}

.panel {
    background: #1b1b1b;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 40px #000;
}

.code {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 8px;
    margin: 15px;
}

.examples {
    margin-top: 20px;
    color: #aaa;
}

.example-code {
    display: inline-block;
    padding: 8px 12px;
    margin: 5px;
    border-radius: 8px;
    background: #292929;
    color: white;
    font-weight: bold;
}

.status {
    margin: 15px;
    color: #aaa;
}

.player-bar {
    display: flex;
    justify-content: space-between;
    max-width: 768px;
    margin: 10px auto;
    padding: 12px 18px;
    background: #202020;
    border-radius: 12px;
}

.board-container {
    width: min(92vw, 768px);
    margin: auto;
}

.board {
    width: 100%;
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 8px solid #202020;
    box-shadow: 0 15px 50px #000;
}

.square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.light {
    background: #f0f0f0;
}

.dark {
    background: #222;
}

.piece {
    font-family: "Times New Roman", serif;
    font-size: clamp(35px, 7vw, 70px);
    line-height: 1;
    user-select: none;
    filter: drop-shadow(3px 4px 2px #000);
}

.white-piece {
    color: #fff;
    -webkit-text-stroke: 1px #111;
}

.black-piece {
    color: #050505;
    -webkit-text-stroke: 1px #777;
}

.selected {
    outline: 5px solid #4caf50;
    outline-offset: -5px;
}

.possible {
    box-shadow: inset 0 0 0 5px rgba(76,175,80,.65);
}

.coordinates {
    position: absolute;
    font-size: 10px;
    font-weight: bold;
    opacity: .6;
    bottom: 3px;
    right: 4px;
}

.controls {
    margin-top: 15px;
}

#gameScreen {
    width: 100%;
}

.info {
    margin-top: 15px;
    color: #aaa;
}
</style>
</head>

<body>

<!-- NOMBRE -->
<div id="nameScreen" class="screen">
    <div class="panel">
        <h1>♟ ChessLink</h1>
        <p class="subtitle">Ajedrez online</p>

        <input
            id="playerName"
            type="text"
            maxlength="20"
            placeholder="Escribe tu nombre"
        >

        <br>

        <button class="primary" onclick="continueToLobby()">
            CONTINUAR
        </button>
    </div>
</div>


<!-- LOBBY -->
<div id="lobbyScreen" class="screen hidden">
    <div class="panel">

        <h1>ChessLink</h1>

        <p class="subtitle">
            Hola, <span id="displayName"></span>
        </p>

        <input
            id="serverUrl"
            type="text"
            value="ws://localhost:8080"
            placeholder="Servidor WebSocket"
        >

        <br>

        <button class="primary" onclick="createRoom()">
            CREAR CÓDIGO
        </button>

        <br>

        <input
            id="joinCode"
            type="text"
            maxlength="4"
            inputmode="numeric"
            placeholder="Código de 4 dígitos"
        >

        <br>

        <button class="secondary" onclick="joinRoom()">
            PONER CÓDIGO
        </button>

        <div class="examples">
            <p>Códigos de ejemplo:</p>

            <span class="example-code">4325</span>
            <span class="example-code">6754</span>
            <span class="example-code">9812</span>

            <p style="margin-top:10px;font-size:13px;">
                Son ejemplos. Una sala debe haber sido creada en el servidor.
            </p>
        </div>

        <div id="lobbyStatus" class="status">
            Desconectado
        </div>

    </div>
</div>


<!-- JUEGO -->
<div id="gameScreen" class="screen hidden">

    <h1>♟ ChessLink</h1>

    <div class="player-bar">
        <span id="blackPlayer">♟ Negro</span>
        <span>NEGRAS</span>
    </div>

    <div class="board-container">
        <div id="board" class="board"></div>
    </div>

    <div class="player-bar">
        <span id="whitePlayer">♙ Blanco</span>
        <span>BLANCAS</span>
    </div>

    <div class="status">
        Sala: <strong id="roomDisplay"></strong>
    </div>

    <div class="status" id="gameStatus">
        Esperando...
    </div>

    <div class="controls">
        <button class="secondary" onclick="location.reload()">
            SALIR
        </button>
    </div>

</div>


<script>

let socket = null;

let playerName = "";
let playerColor = "";
let roomCode = "";

let selectedSquare = null;
let turn = "white";

let board = [
    ["r","n","b","q","k","b","n","r"],
    ["p","p","p","p","p","p","p","p"],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["","","","","","","",""],
    ["P","P","P","P","P","P","P","P"],
    ["R","N","B","Q","K","B","N","R"]
];


const pieces = {
    K: "♔",
    Q: "♕",
    R: "♖",
    B: "♗",
    N: "♘",
    P: "♙",

    k: "♚",
    q: "♛",
    r: "♜",
    b: "♝",
    n: "♞",
    p: "♟"
};


function continueToLobby() {

    const input = document.getElementById("playerName");

    playerName = input.value.trim();

    if (!playerName) {
        alert("Escribe tu nombre.");
        return;
    }

    document.getElementById("displayName").textContent = playerName;

    document.getElementById("nameScreen")
        .classList.add("hidden");

    document.getElementById("lobbyScreen")
        .classList.remove("hidden");
}


function createRoom() {

    connectServer("create");
}


function joinRoom() {

    const code = document
        .getElementById("joinCode")
        .value
        .trim();

    if (!/^\d{4}$/.test(code)) {
        alert("El código debe tener exactamente 4 números.");
        return;
    }

    connectServer("join", code);
}


function connectServer(action, code = "") {

    const url = document
        .getElementById("serverUrl")
        .value
        .trim();

    if (!url) {
        alert("Escribe la dirección del servidor.");
        return;
    }

    document.getElementById("lobbyStatus")
        .textContent = "Conectando...";

    try {

        socket = new WebSocket(url);

        socket.onopen = () => {

            document.getElementById("lobbyStatus")
                .textContent = "Conectado al servidor.";

            if (action === "create") {

                socket.send(JSON.stringify({
                    type: "create",
                    name: playerName
                }));

            } else {

                socket.send(JSON.stringify({
                    type: "join",
                    code: code,
                    name: playerName
                }));

            }
        };


        socket.onmessage = (event) => {

            const data = JSON.parse(event.data);

            handleServerMessage(data);

        };


        socket.onerror = () => {

            document.getElementById("lobbyStatus")
                .textContent = "Error de conexión.";

        };


        socket.onclose = () => {

            if (!document
                .getElementById("gameScreen")
                .classList.contains("hidden")) {

                document.getElementById("gameStatus")
                    .textContent = "Servidor desconectado.";

            }

        };

    } catch (error) {

        alert("No se pudo conectar al servidor.");

    }
}


function handleServerMessage(data) {

    if (data.type === "created") {

        roomCode = data.code;
        playerColor = "white";

        document.getElementById("lobbyStatus")
            .innerHTML =
            "Código creado:<div class='code'>" +
            roomCode +
            "</div>Esperando al otro jugador...";

        openGame();

    }


    if (data.type === "connected") {

        roomCode = data.code;
        playerColor = "black";

        openGame();

    }


    if (data.type === "player_joined") {

        document.getElementById("gameStatus")
            .textContent = "¡El otro jugador se conectó!";

    }


    if (data.type === "move") {

        board = data.board;
        turn = data.turn;

        selectedSquare = null;

        renderBoard();

        document.getElementById("gameStatus")
            .textContent =
            turn === playerColor
            ? "Es tu turno."
            : "Turno del rival.";

    }


    if (data.type === "error") {

        alert(data.message);

        document.getElementById("lobbyStatus")
            .textContent = data.message;

    }


    if (data.type === "opponent_left") {

        document.getElementById("gameStatus")
            .textContent = "El otro jugador salió.";

    }

}


function openGame() {

    document.getElementById("lobbyScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    document.getElementById("roomDisplay")
        .textContent = roomCode;

    document.getElementById("whitePlayer")
        .textContent =
        playerColor === "white"
        ? playerName + " ♙"
        : "Jugador blanco ♙";

    document.getElementById("blackPlayer")
        .textContent =
        playerColor === "black"
        ? playerName + " ♟"
        : "Jugador negro ♟";

    document.getElementById("gameStatus")
        .textContent =
        playerColor === "white"
        ? "Esperando al rival..."
        : "Turno del jugador blanco.";

    renderBoard();
}


function renderBoard() {

    const boardElement =
        document.getElementById("board");

    boardElement.innerHTML = "";

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square =
                document.createElement("div");

            square.className =
                "square " +
                ((row + col) % 2 === 0
                    ? "light"
                    : "dark");

            square.dataset.row = row;
            square.dataset.col = col;

            const piece = board[row][col];

            if (piece) {

                const pieceElement =
                    document.createElement("span");

                pieceElement.className = "piece";

                if (piece === piece.toUpperCase()) {

                    pieceElement.classList.add(
                        "white-piece"
                    );

                } else {

                    pieceElement.classList.add(
                        "black-piece"
                    );

                }

                pieceElement.textContent =
                    pieces[piece];

                square.appendChild(pieceElement);
            }


            if (
                selectedSquare &&
                selectedSquare.row === row &&
                selectedSquare.col === col
            ) {

                square.classList.add("selected");

            }


            const coordinate =
                document.createElement("span");

            coordinate.className = "coordinates";

            coordinate.textContent =
                String.fromCharCode(97 + col) +
                (8 - row);

            square.appendChild(coordinate);


            square.onclick = () =>
                clickSquare(row, col);

            boardElement.appendChild(square);
        }
    }
}


function clickSquare(row, col) {

    if (turn !== playerColor) {
        return;
    }

    const piece = board[row][col];


    if (!selectedSquare) {

        if (!piece) return;

        const isWhite =
            piece === piece.toUpperCase();

        if (
            (playerColor === "white" && !isWhite) ||
            (playerColor === "black" && isWhite)
        ) {
            return;
        }

        selectedSquare = {
            row: row,
            col: col
        };

        renderBoard();

        return;
    }


    if (
        selectedSquare.row === row &&
        selectedSquare.col === col
    ) {

        selectedSquare = null;

        renderBoard();

        return;
    }


    const movingPiece =
        board[selectedSquare.row][selectedSquare.col];

    board[row][col] = movingPiece;

    board[selectedSquare.row][selectedSquare.col] = "";

    selectedSquare = null;

    turn =
        turn === "white"
        ? "black"
        : "white";

    renderBoard();

    document.getElementById("gameStatus")
        .textContent =
        turn === playerColor
        ? "Es tu turno."
        : "Turno del rival.";

    if (socket && socket.readyState === WebSocket.OPEN) {

        socket.send(JSON.stringify({
            type: "move",
            board: board,
            turn: turn
        }));

    }
}

</script>

</body>
</html>
