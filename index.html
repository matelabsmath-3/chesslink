<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChessLink</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.screen {
    width: 100%;
    max-width: 1250px;
    padding: 20px;
    text-align: center;
}

.hidden {
    display: none;
}

.panel {
    background: #1c1c1c;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 50px #000;
}

h1 {
    font-size: 45px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

input {
    width: 100%;
    max-width: 420px;
    padding: 15px;
    margin: 8px;
    border-radius: 10px;
    border: 2px solid #444;
    background: #111;
    color: white;
    font-size: 17px;
    text-align: center;
}

button {
    border: none;
    border-radius: 10px;
    padding: 15px 28px;
    margin: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #4caf50;
    color: white;
}

.secondary {
    background: #333;
    color: white;
}

.code {
    font-size: 45px;
    font-weight: bold;
    letter-spacing: 8px;
    margin: 20px;
}

.status {
    color: #aaa;
    margin: 15px;
}

/* =========================
   TABLERO
========================= */

.board-wrapper {
    width: min(94vw, 1248px);
    margin: auto;
}

.board {
    position: relative;

    width: 100%;
    aspect-ratio: 1 / 1;

    background-image: url("tablero.jpg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}

/*
Cada casilla ocupa exactamente
1/8 del tablero.
*/

.square {
    position: absolute;

    width: 12.5%;
    height: 12.5%;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;
}

.square:hover {
    background: rgba(80, 180, 80, 0.20);
}

.selected {
    background: rgba(70, 180, 70, 0.45);
}

.possible {
    background: rgba(70, 180, 70, 0.25);
}

/* =========================
   PIEZAS
========================= */

.piece {
    font-family: "Times New Roman", serif;

    font-size: clamp(
        45px,
        8vw,
        115px
    );

    line-height: 1;

    user-select: none;

    pointer-events: none;

    filter:
        drop-shadow(4px 5px 3px rgba(0,0,0,.9));
}

.white-piece {
    color: white;
    -webkit-text-stroke: 2px black;
}

.black-piece {
    color: black;
    -webkit-text-stroke: 2px white;
}

/* =========================
   JUGADORES
========================= */

.player {
    width: min(94vw, 1248px);

    margin: 10px auto;

    background: #1c1c1c;

    border-radius: 12px;

    padding: 13px 20px;

    display: flex;
    justify-content: space-between;

    font-weight: bold;
}

.room {
    margin: 15px;
    color: #aaa;
}

</style>
</head>


<body>


<!-- =========================
     PANTALLA NOMBRE
========================= -->

<div id="nameScreen" class="screen">

    <div class="panel">

        <h1>♟ ChessLink</h1>

        <div class="subtitle">
            Ajedrez online
        </div>

        <input
            id="playerName"
            maxlength="20"
            placeholder="Tu nombre"
        >

        <br>

        <button
            class="primary"
            onclick="continueGame()"
        >
            CONTINUAR
        </button>

    </div>

</div>



<!-- =========================
     LOBBY
========================= -->

<div id="lobbyScreen" class="screen hidden">

    <div class="panel">

        <h1>ChessLink</h1>

        <div class="subtitle">
            Jugador:
            <strong id="nameDisplay"></strong>
        </div>


        <input
            id="serverURL"
            value="ws://localhost:8080"
            placeholder="Servidor WebSocket"
        >

        <br>


        <button
            class="primary"
            onclick="createRoom()"
        >
            CREAR CÓDIGO
        </button>


        <br>


        <input
            id="roomCode"
            maxlength="4"
            inputmode="numeric"
            placeholder="Código de 4 números"
        >


        <br>


        <button
            class="secondary"
            onclick="joinRoom()"
        >
            PONER CÓDIGO
        </button>


        <div class="status">

            Códigos de ejemplo:

            <strong>4325</strong>

            ·

            <strong>6754</strong>

            ·

            <strong>9812</strong>

        </div>


        <div
            id="lobbyStatus"
            class="status"
        >
            Desconectado
        </div>

    </div>

</div>



<!-- =========================
     JUEGO
========================= -->

<div id="gameScreen" class="screen hidden">


    <h1>♟ ChessLink</h1>


    <div class="player">

        <span id="blackPlayer">
            ♟ Negro
        </span>

        <span>
            NEGRAS
        </span>

    </div>


    <div class="board-wrapper">

        <div
            id="board"
            class="board"
        ></div>

    </div>


    <div class="player">

        <span id="whitePlayer">
            ♙ Blanco
        </span>

        <span>
            BLANCAS
        </span>

    </div>


    <div class="room">

        Sala:

        <strong id="roomDisplay">
            ----
        </strong>

    </div>


    <div
        id="gameStatus"
        class="status"
    >
        Esperando...
    </div>


    <button
        class="secondary"
        onclick="location.reload()"
    >
        SALIR
    </button>

</div>



<script>

/* =========================
   VARIABLES
========================= */

let socket = null;

let playerName = "";

let playerColor = "";

let roomCode = "";

let selected = null;

let turn = "white";


/* =========================
   PIEZAS
========================= */

const pieces = {

    K: "♔",
    Q: "♕",
    R: "♖",
    B: "♗",
    N: "♘",
    P: "♙",

    k: "♚",
    q: "♛",
    r: "♜",
    b: "♝",
    n: "♞",
    p: "♟"

};


/* =========================
   POSICIÓN INICIAL
========================= */

let board = [

    ["r","n","b","q","k","b","n","r"],

    ["p","p","p","p","p","p","p","p"],

    ["","","","","","","",""],

    ["","","","","","","",""],

    ["","","","","","","",""],

    ["","","","","","","",""],

    ["P","P","P","P","P","P","P","P"],

    ["R","N","B","Q","K","B","N","R"]

];


/* =========================
   NOMBRE
========================= */

function continueGame() {

    const input =
        document.getElementById("playerName");

    playerName =
        input.value.trim();


    if (!playerName) {

        alert("Escribe tu nombre.");

        return;
    }


    document.getElementById(
        "nameDisplay"
    ).textContent = playerName;


    document.getElementById(
        "nameScreen"
    ).classList.add("hidden");


    document.getElementById(
        "lobbyScreen"
    ).classList.remove("hidden");

}


/* =========================
   CREAR SALA
========================= */

function createRoom() {

    connectServer("create");

}


/* =========================
   UNIRSE
========================= */

function joinRoom() {

    const code =
        document
        .getElementById("roomCode")
        .value
        .trim();


    if (!/^\d{4}$/.test(code)) {

        alert(
            "El código debe tener 4 números."
        );

        return;
    }


    connectServer(
        "join",
        code
    );

}


/* =========================
   SERVIDOR
========================= */

function connectServer(
    action,
    code = ""
) {

    const url =
        document
        .getElementById("serverURL")
        .value
        .trim();


    if (!url) {

        alert(
            "Escribe la dirección del servidor."
        );

        return;
    }


    document.getElementById(
        "lobbyStatus"
    ).textContent =
        "Conectando...";


    socket =
        new WebSocket(url);


    socket.onopen = function() {

        if (action === "create") {

            socket.send(
                JSON.stringify({

                    type: "create",

                    name: playerName

                })
            );

        }


        if (action === "join") {

            socket.send(
                JSON.stringify({

                    type: "join",

                    name: playerName,

                    code: code

                })
            );

        }

    };


    socket.onmessage = function(event) {

        const data =
            JSON.parse(event.data);


        handleMessage(data);

    };


    socket.onerror = function() {

        document.getElementById(
            "lobbyStatus"
        ).textContent =
            "No se pudo conectar.";

    };


    socket.onclose = function() {

        document.getElementById(
            "gameStatus"
        ).textContent =
            "Servidor desconectado.";

    };

}


/* =========================
   MENSAJES
========================= */

function handleMessage(data) {


    if (data.type === "created") {

        roomCode =
            data.code;

        playerColor =
            "white";


        document.getElementById(
            "lobbyStatus"
        ).innerHTML =

            "Tu código es:" +

            "<div class='code'>" +

            roomCode +

            "</div>" +

            "Esperando al rival...";


        openGame();

    }


    if (data.type === "connected") {

        roomCode =
            data.code;

        playerColor =
            "black";


        openGame();

    }


    if (data.type === "player_joined") {

        document.getElementById(
            "gameStatus"
        ).textContent =
            "¡Rival conectado!";

    }


    if (data.type === "move") {

        board =
            data.board;

        turn =
            data.turn;

        selected =
            null;

        drawBoard();

        updateStatus();

    }


    if (data.type === "error") {

        alert(data.message);

        document.getElementById(
            "lobbyStatus"
        ).textContent =
            data.message;

    }


    if (data.type === "opponent_left") {

        document.getElementById(
            "gameStatus"
        ).textContent =
            "El rival salió.";

    }

}


/* =========================
   ABRIR JUEGO
========================= */

function openGame() {

    document.getElementById(
        "lobbyScreen"
    ).classList.add("hidden");


    document.getElementById(
        "gameScreen"
    ).classList.remove("hidden");


    document.getElementById(
        "roomDisplay"
    ).textContent =
        roomCode;


    document.getElementById(
        "whitePlayer"
    ).textContent =

        playerColor === "white"

        ? playerName + " ♔"

        : "Jugador blanco ♔";


    document.getElementById(
        "blackPlayer"
    ).textContent =

        playerColor === "black"

        ? playerName + " ♚"

        : "Jugador negro ♚";


    drawBoard();

    updateStatus();

}


/* =========================
   DIBUJAR TABLERO
========================= */

function drawBoard() {

    const boardElement =
        document.getElementById("board");


    boardElement.innerHTML = "";


    for (
        let row = 0;
        row < 8;
        row++
    ) {


        for (
            let col = 0;
            col < 8;
            col++
        ) {


            const square =
                document.createElement("div");


            square.className =
                "square";


            square.style.left =
                (col * 12.5) + "%";


            square.style.top =
                (row * 12.5) + "%";


            const piece =
                board[row][col];


            if (piece) {

                const element =
                    document.createElement(
                        "span"
                    );


                element.className =
                    "piece";


                if (
                    piece ===
                    piece.toUpperCase()
                ) {

                    element.classList.add(
                        "white-piece"
                    );

                } else {

                    element.classList.add(
                        "black-piece"
                    );

                }


                element.textContent =
                    pieces[piece];


                square.appendChild(
                    element
                );

            }


            if (
                selected &&
                selected.row === row &&
                selected.col === col
            ) {

                square.classList.add(
                    "selected"
                );

            }


            square.onclick =
                function() {

                    clickSquare(
                        row,
                        col
                    );

                };


            boardElement.appendChild(
                square
            );

        }

    }

}


/* =========================
   CLIC EN CASILLA
========================= */

function clickSquare(
    row,
    col
) {


    if (
        turn !== playerColor
    ) {

        return;

    }


    const piece =
        board[row][col];


    /* Seleccionar */

    if (!selected) {


        if (!piece) {

            return;

        }


        const isWhite =
            piece ===
            piece.toUpperCase();


        if (
            playerColor === "white" &&
            !isWhite
        ) {

            return;

        }


        if (
            playerColor === "black" &&
            isWhite
        ) {

            return;

        }


        selected = {

            row: row,

            col: col

        };


        drawBoard();

        return;

    }


    /* Deseleccionar */

    if (
        selected.row === row &&
        selected.col === col
    ) {

        selected = null;

        drawBoard();

        return;

    }


    /* Mover pieza */

    const movingPiece =
        board[
            selected.row
        ][
            selected.col
        ];


    board[row][col] =
        movingPiece;


    board[
        selected.row
    ][
        selected.col
    ] = "";


    selected = null;


    turn =
        turn === "white"
        ? "black"
        : "white";


    drawBoard();

    updateStatus();


    /* Enviar movimiento */

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({

                type: "move",

                board: board,

                turn: turn

            })
        );

    }

}


/* =========================
   ESTADO
========================= */

function updateStatus() {

    const status =
        document.getElementById(
            "gameStatus"
        );


    if (
        turn === playerColor
    ) {

        status.textContent =
            "Es tu turno.";

    } else {

        status.textContent =
            "Turno del rival.";

    }

}

</script>

</body>
</html>
